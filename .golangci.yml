# golangci-lint v2 configuration. The thresholds below encode the team's Go standard
# (Google style plus local rules): 120-column lines, functions under 80 lines, nesting under
# 4, a default last in every switch that has one (enum switches must be exhaustive), errors wrapped
# and checked, no package importing upward.
version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - exhaustive
    - funlen
    - gocritic
    - gocyclo
    - gosec
    - intrange
    - lll
    - misspell
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        # The kit is the platform's one set of building blocks; a second router, ORM or logger
        # beside chi, pgx and slog would split every service that imports it. The same rule as the
        # kit's .golangci.yml.
        no-alternative-frameworks:
          files: ["$all"]
          deny:
            - pkg: "github.com/gin-gonic/gin"
              desc: "the router is chi"
            - pkg: "github.com/labstack/echo"
              desc: "the router is chi"
            - pkg: "github.com/sirupsen/logrus"
              desc: "logging is log/slog"
            - pkg: "go.uber.org/zap"
              desc: "logging is log/slog"
        # GORM is the postgres adapter's detail: the models, the hooks and Gorm.On live in
        # internal/postgres, and everything else sees the context's ports. The composition root
        # opens it through postgres.OpenGorm, so it needs no GORM import either.
        gorm-stays-in-the-adapter:
          files: ["**/internal/**", "!**/internal/postgres/**"]
          deny:
            - pkg: "gorm.io"
              desc: "GORM belongs to internal/postgres; use the context's ports (or postgres.OpenGorm in app)"
        # The business packages import no driver and no adapter: ports in, implementations beside
        # them. Matched by exclusion so the rule survives renaming internal/order or adding a second
        # context beside it: everything under internal/ EXCEPT the packages allowed to see drivers
        # or adapters — the composition root and the adapters themselves ("!" negates a glob; a
        # file is covered when it matches a positive glob and no negated one). A new adapter
        # package (a second downstream client, another store) goes on this list; a new business
        # context, consumer or task host needs nothing — it is covered as it should be.
        order-stays-pure:
          files:
            - "**/internal/**"
            - "!**/internal/app/**"
            - "!**/internal/httpapi/**"
            - "!**/internal/postgres/**"
            - "!**/internal/inventory/**"
          deny:
            - pkg: "example.com/msvcservice/internal/postgres"
              desc: "order declares the Repository port; internal/postgres implements it"
            - pkg: "example.com/msvcservice/internal/inventory"
              desc: "order declares the InventoryClient port; internal/inventory implements it"
            - pkg: "example.com/msvcservice/internal/httpapi"
              desc: "the business package must not depend on the HTTP surface"
            - pkg: "example.com/msvcservice/internal/app"
              desc: "the business package must not depend on the composition root"
            - pkg: "github.com/jackc/pgx"
              desc: "no database driver in the business package"
            - pkg: "github.com/rabbitmq/amqp091-go"
              desc: "no broker client in the business package"
            - pkg: "github.com/twmb/franz-go"
              desc: "no broker client in the business package"
            - pkg: "github.com/go-chi"
              desc: "no router in the business package"
        # Handlers use the service, never a repository or a driver.
        httpapi-uses-the-service:
          files: ["**/internal/httpapi/**"]
          deny:
            - pkg: "example.com/msvcservice/internal/postgres"
              desc: "handlers call order.Service, never a repository"
            - pkg: "example.com/msvcservice/internal/inventory"
              desc: "handlers call order.Service, never a downstream adapter"
            - pkg: "github.com/jackc/pgx"
              desc: "handlers never touch the database"
    funlen:
      lines: 80
      statements: -1
      ignore-comments: true
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 120
      tab-width: 4
    nestif:
      min-complexity: 5
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
        - name: enforce-switch-style
          arguments: ["allowNoDefault"]
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers it with better exclusions
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [funlen, gocyclo, gosec, lll, noctx, bodyclose, unparam]
      - path: tests/
        linters: [funlen, gocyclo, gosec, lll, noctx, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # The service and the platform kit form one import group, after the third-party one.
      local-prefixes: ["example.com/msvcservice", "github.com/guangliangus/go-msvc-kit"]
