# golangci-lint v2 configuration. The thresholds below encode the team's Go standard
# (Google style plus local rules): 120-column lines, functions under 80 lines, nesting under
# 4, every switch with a default, errors wrapped and checked, no package importing upward.
version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - exhaustive
    - funlen
    - gocritic
    - gocyclo
    - gosec
    - intrange
    - lll
    - misspell
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        # The kit never imports the service: pkg/ is what will be extracted to a shared module.
        kit-does-not-import-service:
          files: ["**/pkg/**"]
          deny:
            - pkg: "example.com/msvcservice/internal"
              desc: "pkg/ must not depend on internal/ (dependency direction)"
        # The business package imports no driver and no adapter: ports in, implementations beside it.
        order-stays-pure:
          files: ["**/internal/order/**"]
          deny:
            - pkg: "example.com/msvcservice/internal/postgres"
              desc: "order declares the Repository port; internal/postgres implements it"
            - pkg: "example.com/msvcservice/internal/inventory"
              desc: "order declares the InventoryClient port; internal/inventory implements it"
            - pkg: "example.com/msvcservice/internal/httpapi"
              desc: "the business package must not depend on the HTTP surface"
            - pkg: "example.com/msvcservice/internal/app"
              desc: "the business package must not depend on the composition root"
            - pkg: "github.com/jackc/pgx"
              desc: "no database driver in the business package"
            - pkg: "github.com/rabbitmq/amqp091-go"
              desc: "no broker client in the business package"
            - pkg: "github.com/go-chi"
              desc: "no router in the business package"
        # Handlers use the service, never a repository or a driver.
        httpapi-uses-the-service:
          files: ["**/internal/httpapi/**"]
          deny:
            - pkg: "example.com/msvcservice/internal/postgres"
              desc: "handlers call order.Service, never a repository"
            - pkg: "example.com/msvcservice/internal/inventory"
              desc: "handlers call order.Service, never a downstream adapter"
            - pkg: "github.com/jackc/pgx"
              desc: "handlers never touch the database"
    funlen:
      lines: 80
      statements: -1
      ignore-comments: true
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 120
      tab-width: 4
    nestif:
      min-complexity: 5
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
        - name: enforce-switch-style
          arguments: ["allowNoDefault"]
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers it with better exclusions
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [funlen, gocyclo, gosec, lll, noctx, bodyclose, unparam]
      - path: tests/
        linters: [funlen, gocyclo, gosec, lll, noctx, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: ["example.com/msvcservice"]
