# CI/CD for msvcservice.
# Prereqs: a Docker registry service connection (containerRegistry — and registryHost below set to
# THAT registry's host name) and Kubernetes service connections (k8sConnectionDev /
# k8sConnectionProd) configured in the Azure DevOps project, and a GitHubKitToken SECRET variable:
# a read-only fine-grained GitHub token (repository go-msvc-kit only, Contents: Read) with which
# the go command and the image build fetch the private kit. The DDL gate starts its own PostgreSQL
# on the agent for the run and needs nothing.

trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  # The Go toolchain is pinned here and in the Dockerfile (golang:<minor>-alpine); Renovate bumps
  # both in one PR (renovate.json, "Go toolchain").
  # renovate: datasource=golang-version depName=go versioning=go-mod-directive
  goVersion: "1.27"
  # The platform kit is a private GitHub module: no public proxy, no public checksum database.
  GOPRIVATE: github.com/guangliangus/*
  # Tool versions are pinned (Renovate bumps them, see renovate.json); install scripts are fetched
  # from the SAME tag they install, never from a moving branch. The Go tools (gotestsum,
  # gocover-cobertura, govulncheck) are pinned in tools/go.mod instead.
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  golangciLintVersion: v2.14.0
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  trivyVersion: v0.75.0
  # Helm 3: Helm 4 deprecates the deploy step's --atomic (now --rollback-on-failure); move both together.
  # renovate: datasource=github-releases depName=helm/helm
  helmVersion: v3.22.0
  # The PostgreSQL the DDL gate runs against (same major as docker-compose.yml / deploy/kind).
  # renovate: datasource=docker depName=postgres
  postgresVersion: 18-alpine
  securityScan: true
  containerRegistry: my-registry-connection
  # AUTHORITATIVE image location: every image reference in this pipeline (build tag, scan, push,
  # Helm image.repository) is $(registryHost)/$(imageName):$(imageTag). The service connection
  # above only provides the login, so registryHost MUST be that connection's host — otherwise the
  # push lands in one registry and the deploy pulls from another.
  registryHost: registry.example.com
  imageName: msvcservice
  imageTag: $(Build.BuildNumber)
  imageRef: $(registryHost)/$(imageName):$(imageTag)
  helmReleaseName: msvcservice
  buildWorker: false # flip to true for a service with its own worker deployment
  k8sConnectionDev: my-k8s-connection-dev
  k8sConnectionProd: my-k8s-connection
  helmNamespaceDev: services-dev
  helmNamespaceProd: services
  # Lark/Feishu group webhook for deploy notifications; keep it in a variable group as a secret
  # variable and map it here. Empty skips the notification steps.
  notifyWebhookUrl: ""

stages:
  - stage: Build
    displayName: Build & test
    jobs:
      - job: build
        steps:
          - task: GoTool@0
            displayName: Pin Go
            inputs:
              version: $(goVersion)

          - script: |
              set -e
              printf 'machine github.com login x-access-token password %s\n' "$KIT_TOKEN" > "$HOME/.netrc"
              chmod 600 "$HOME/.netrc"
            displayName: Credential for the private kit module
            env:
              KIT_TOKEN: $(GitHubKitToken)

          - script: go mod download
            displayName: go mod download

          - script: go build ./... && go vet ./...
            displayName: go build + vet

          - script: |
              set -e
              curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/$(golangciLintVersion)/install.sh" \
                | sh -s -- -b "$(go env GOPATH)/bin" "$(golangciLintVersion)"
              "$(go env GOPATH)/bin/golangci-lint" run ./...
            displayName: golangci-lint

          # gotestsum writes the JUnit file the Tests tab reads; coverage goes to the Coverage tab as
          # Cobertura. Both publish on failure too, so a red run shows WHICH test, not just red.
          - script: |
              set -e
              go tool -modfile=tools/go.mod gotestsum --junitfile "$(Build.ArtifactStagingDirectory)/unit.xml" --format testname -- \
                -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
              go tool -modfile=tools/go.mod gocover-cobertura < coverage.txt > "$(Build.ArtifactStagingDirectory)/coverage.xml"
            displayName: unit tests (plus the architecture and DDL guards)

          # Integration tests use Testcontainers; the agent has Docker. CI=true turns a silent
          # "no Docker, skipping" into a failure, so a green run always proves something.
          - script: |
              set -e
              go tool -modfile=tools/go.mod gotestsum --junitfile "$(Build.ArtifactStagingDirectory)/integration.xml" --format testname -- \
                -race -count=1 -tags=integration -timeout 20m ./tests/...
            displayName: integration tests (Testcontainers)
            env:
              CI: "true"

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "$(Build.ArtifactStagingDirectory)/*.xml"
              mergeTestResults: true
              testRunTitle: $(imageName)

          - task: PublishCodeCoverageResults@2
            displayName: Publish coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(Build.ArtifactStagingDirectory)/coverage.xml

          # Supply chain: the Go vulnerability database against the exact module graph.
          - script: go tool -modfile=tools/go.mod govulncheck ./...
            displayName: govulncheck

          # DDL gate: every db/*.sql is applied twice to a PostgreSQL started on the agent for this
          # run; the second pass must succeed with no side effects, which is what "idempotent,
          # re-runnable by hand" means in practice. A fresh database every run: nothing left by an
          # earlier run can turn the first pass into a no-op and hide a non-idempotent script.
          - script: |
              set -e
              docker run -d --rm --name ddl-gate -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci "postgres:$(postgresVersion)"
              trap 'docker rm -f ddl-gate >/dev/null 2>&1 || true' EXIT
              # -h localhost (TCP): only the final server listens there, not the init-time one.
              for _ in $(seq 1 30); do
                docker exec ddl-gate pg_isready -h localhost -U postgres -d ci >/dev/null 2>&1 && break
                sleep 1
              done
              docker exec ddl-gate pg_isready -h localhost -U postgres -d ci
              for f in db/*.sql; do
                echo ">>> $f"
                docker exec -i -e PGPASSWORD=ci ddl-gate psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -q < "$f"
                docker exec -i -e PGPASSWORD=ci ddl-gate psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -q < "$f"
              done
            displayName: DDL idempotency (run twice against a fresh PostgreSQL)

          - task: HelmInstaller@1
            displayName: Pin Helm
            inputs:
              helmVersionToInstall: $(helmVersion)

          # Chart breakage fails here, before merge, not in the deploy stage: lint, then render every
          # shape the pipeline deploys (both overlays, worker off and on) with the image reference the
          # Package stage would ship. The overlays create no Secret (the operator does), so this needs
          # no secret values.
          - script: |
              set -e
              helm lint deploy/helm/msvcservice
              for env in dev prod; do
                for worker in false true; do
                  helm template $(helmReleaseName) deploy/helm/msvcservice \
                    -f deploy/helm/msvcservice/values.$env.yaml \
                    --set image.repository=$(registryHost)/$(imageName) --set image.tag=$(imageTag) \
                    --set worker.enabled=$worker > /dev/null
                done
              done
            displayName: helm lint & template (both overlays, worker off/on)

          # The image is built on every run and pushed on none: a broken Dockerfile or a kit
          # credential problem fails before merge. Same BuildKit secret as the Package stage.
          - script: |
              set -e
              docker build --secret id=netrc,env=KIT_NETRC --build-arg VERSION=$(imageTag) \
                -t "$(imageName):ci-$(imageTag)" .
            displayName: docker build (no push)
            env:
              DOCKER_BUILDKIT: "1"
              KIT_NETRC: machine github.com login x-access-token password $(GitHubKitToken)

          # The kit credential was written to the agent's home for the go command. A hosted agent
          # is discarded after the job; a self-hosted one is not, so remove it whatever happened.
          - script: rm -f "$HOME/.netrc"
            displayName: Remove the kit credential
            condition: always()

  - stage: Package
    displayName: Docker build, scan & push
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: docker
        steps:
          - task: Docker@2
            displayName: Registry login
            inputs:
              command: login
              containerRegistry: $(containerRegistry)

          # Build, scan and push are separate steps on purpose: the Docker@2 buildAndPush command
          # ignores `arguments`, which would silently drop both the version build arg and the kit
          # secret, and the scan sits between build and push. One reference, $(imageRef), names
          # the image in all three. The kit credential reaches the build as a BuildKit secret,
          # never as a build arg.
          - script: |
              set -e
              docker build --secret id=netrc,env=KIT_NETRC --build-arg VERSION=$(imageTag) -t "$(imageRef)" .
            displayName: Build image
            env:
              DOCKER_BUILDKIT: "1"
              KIT_NETRC: machine github.com login x-access-token password $(GitHubKitToken)

          # The scan runs on the local tag BEFORE the push: a HIGH/CRITICAL finding means the tag
          # never reaches the registry; rebuild with patched bases and the next run ships.
          - script: |
              set -e
              curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/$(trivyVersion)/contrib/install.sh" \
                | sh -s -- -b "$(Agent.TempDirectory)/trivy-bin" "$(trivyVersion)"
              export PATH="$(Agent.TempDirectory)/trivy-bin:$PATH"
              mkdir -p "$(Build.ArtifactStagingDirectory)/sbom"
              trivy image --format cyclonedx --output "$(Build.ArtifactStagingDirectory)/sbom/$(imageName).cdx.json" "$(imageRef)"
              trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$(imageRef)"
            displayName: Trivy image scan + SBOM (HIGH/CRITICAL fail, before the push)
            condition: and(succeeded(), eq(variables.securityScan, 'true'))

          - task: PublishBuildArtifacts@1
            displayName: Publish SBOM
            condition: and(succeeded(), eq(variables.securityScan, 'true'))
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/sbom
              ArtifactName: sbom

          - script: docker push "$(imageRef)"
            displayName: Push image

          - task: Docker@2
            displayName: Registry logout
            condition: always()
            inputs:
              command: logout
              containerRegistry: $(containerRegistry)

  # Environments are Helm value overlays: values.yaml (safe baseline) + values.{env}.yaml
  # (differences only). Dev deploys automatically; production waits for the approval check on
  # the 'production' environment (Azure DevOps → Environments → production → Approvals).
  # The chart creates no Secret with these overlays: <release>-secrets (or secret.existingName)
  # exists in the namespace before the first run (README, "从零新增一个服务" step 7).
  - stage: DeployDev
    displayName: Helm deploy (dev)
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy_dev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: $(helmVersion)
                - task: HelmDeploy@1
                  displayName: helm upgrade (dev)
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceConnection: $(k8sConnectionDev)
                    namespace: $(helmNamespaceDev)
                    command: upgrade
                    chartType: FilePath
                    chartPath: deploy/helm/msvcservice
                    releaseName: $(helmReleaseName)
                    arguments: >-
                      --install --atomic --timeout 5m
                      -f deploy/helm/msvcservice/values.dev.yaml
                      --set image.repository=$(registryHost)/$(imageName) --set image.tag=$(imageTag)
                      --set worker.enabled=$(buildWorker)
                - script: |
                    set -e
                    status="$JOB_STATUS"; emoji="✅"; template="green"; result="发布成功"
                    if [ "$status" != "Succeeded" ]; then emoji="❌"; template="red"; result="发布失败"; fi
                    pipeline_url="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                    content="**服务：** $(imageName)\n**环境：** $ENV_NAME\n**版本：** $(imageTag)\n**提交：** ${BUILD_SOURCEVERSION:0:8} $(Build.SourceVersionMessage)\n**发布人：** $(Build.RequestedFor)"
                    payload=$(python3 - "$emoji $(imageName) $result [$ENV_NAME]" "$template" "$content" "$pipeline_url" <<'PYEOF'
                    import json, sys
                    title, template, content, url = sys.argv[1:5]
                    print(json.dumps({"msg_type": "interactive", "card": {"schema": "2.0",
                      "header": {"title": {"tag": "plain_text", "content": title}, "template": template},
                      "body": {"elements": [{"tag": "markdown", "content": content.replace("\\n", "\n")},
                        {"tag": "button", "text": {"tag": "plain_text", "content": "查看 Pipeline"}, "multi_url": {"url": url}}]}}},
                      ensure_ascii=False))
                    PYEOF
                    )
                    curl -sS --fail-with-body -X POST "$NOTIFY_WEBHOOK_URL" -H 'Content-Type: application/json' --data "$payload"
                  displayName: Notify (Lark/Feishu)
                  condition: and(always(), ne(variables['notifyWebhookUrl'], ''))
                  env:
                    NOTIFY_WEBHOOK_URL: $(notifyWebhookUrl)
                    JOB_STATUS: $(Agent.JobStatus)
                    ENV_NAME: dev

  - stage: DeployProd
    displayName: Helm deploy (production)
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy_prod
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: $(helmVersion)
                - task: HelmDeploy@1
                  displayName: helm upgrade (production)
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceConnection: $(k8sConnectionProd)
                    namespace: $(helmNamespaceProd)
                    command: upgrade
                    chartType: FilePath
                    chartPath: deploy/helm/msvcservice
                    releaseName: $(helmReleaseName)
                    arguments: >-
                      --install --atomic --timeout 5m
                      -f deploy/helm/msvcservice/values.prod.yaml
                      --set image.repository=$(registryHost)/$(imageName) --set image.tag=$(imageTag)
                      --set worker.enabled=$(buildWorker)
                - script: |
                    set -e
                    status="$JOB_STATUS"; emoji="✅"; template="green"; result="发布成功"
                    if [ "$status" != "Succeeded" ]; then emoji="❌"; template="red"; result="发布失败"; fi
                    pipeline_url="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                    content="**服务：** $(imageName)\n**环境：** $ENV_NAME\n**版本：** $(imageTag)\n**提交：** ${BUILD_SOURCEVERSION:0:8} $(Build.SourceVersionMessage)\n**发布人：** $(Build.RequestedFor)"
                    payload=$(python3 - "$emoji $(imageName) $result [$ENV_NAME]" "$template" "$content" "$pipeline_url" <<'PYEOF'
                    import json, sys
                    title, template, content, url = sys.argv[1:5]
                    print(json.dumps({"msg_type": "interactive", "card": {"schema": "2.0",
                      "header": {"title": {"tag": "plain_text", "content": title}, "template": template},
                      "body": {"elements": [{"tag": "markdown", "content": content.replace("\\n", "\n")},
                        {"tag": "button", "text": {"tag": "plain_text", "content": "查看 Pipeline"}, "multi_url": {"url": url}}]}}},
                      ensure_ascii=False))
                    PYEOF
                    )
                    curl -sS --fail-with-body -X POST "$NOTIFY_WEBHOOK_URL" -H 'Content-Type: application/json' --data "$payload"
                  displayName: Notify (Lark/Feishu)
                  condition: and(always(), ne(variables['notifyWebhookUrl'], ''))
                  env:
                    NOTIFY_WEBHOOK_URL: $(notifyWebhookUrl)
                    JOB_STATUS: $(Agent.JobStatus)
                    ENV_NAME: production
