# Throwaway in-cluster dependencies for the kind smoke test. Not for anything else.
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - { name: POSTGRES_USER, value: msvc }
            - { name: POSTGRES_PASSWORD, value: msvc }
            - { name: POSTGRES_DB, value: msvcservice }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, labels: { app: rabbitmq } }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec:
  selector: { app: rabbitmq }
  ports: [{ name: amqp, port: 5672 }, { name: mgmt, port: 15672 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: wiremock, labels: { app: wiremock } }
spec:
  replicas: 1
  selector: { matchLabels: { app: wiremock } }
  template:
    metadata: { labels: { app: wiremock } }
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.9.1
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: wiremock }
spec:
  selector: { app: wiremock }
  ports: [{ port: 8080 }]
