{{- /*
The app Secret (POSTGRES__DSN, RABBITMQ__URL, AUTH__SIGNING_KEY, ...) is rendered only with
secret.create=true and no secret.existingName. An EMPTY Secret is refused at render time: the pod
would refuse to start without AUTH__SIGNING_KEY and `helm upgrade --atomic` would roll back with
nothing in the events to say why. Without create (the overlays' default) the operator provides
<release>-secrets, or names theirs in secret.existingName.
*/ -}}
{{- if include "msvc.secretManaged" . }}
{{- if not .Values.secret.values }}
{{- fail (printf "secret.create=true but secret.values is empty: the pods need POSTGRES__DSN, RABBITMQ__URL and AUTH__SIGNING_KEY. Either set secret.values, or set secret.create=false and create the Secret '%s' in the namespace first (or point secret.existingName at yours)." (include "msvc.secretName" .)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "msvc.secretName" . }}
  labels:
    {{- include "msvc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
