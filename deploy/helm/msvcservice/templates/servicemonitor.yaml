{{- if .Values.serviceMonitor.enabled }}
# No jobLabel on purpose: the operator then sets the `job` target label to the Service NAME, i.e.
# <release>-api / <release>-worker — the same values compose's prometheus.yml uses
# (msvcservice-api / msvcservice-worker) and the only selector deploy/grafana/alerts.yml filters
# on ({job=~"msvcservice-.*"}). Keep the release named after the service or the rules match nothing.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "msvc.fullname" . }}
  labels:
    {{- include "msvc.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "msvc.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
