global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus-rules/alerts.yml

# /metrics lives on the admin listener: 8081 in the containers and for `make run`, 8082 for
# `make run-worker` (both on the host).
scrape_configs:
  - job_name: msvcservice-api
    static_configs:
      - targets: ["api:8081", "host.docker.internal:8081"]
  - job_name: msvcservice-worker
    static_configs:
      - targets: ["worker:8081", "host.docker.internal:8082"]
