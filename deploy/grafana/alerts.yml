# msvcservice 告警规则。compose 里的 Prometheus 直接加载这份文件；集群里用
# deploy/grafana/import-alerts.sh 导入成 Grafana-managed 规则（页面可编辑）。Prometheus 规则格式，
# 阈值写在 expr 里，导入脚本调的 Grafana 转换 API 只吃这种格式。
#
# 每条规则带三个路由标签，给通知策略用：
#   service    = msvcservice                         按服务路由到一个群
#   alertgroup = http | messaging | tasks | database | infra   按关注面分流
#   severity   = critical | warning                  按紧急度分流
# annotations 里直接写排查入口：LogQL、SQL、常见成因。阈值是起步值，按服务调。
#
# ⚠️ 导入 Grafana 后把每条规则的「No data」设为 Normal：计数类指标在第一次发生前根本没有
#    序列，查询为空会被判成 NoData，而手建规则的默认 NoData 行为是 Alerting，系统完全健康时
#    反而一直报警。import-alerts.sh 会回读并标出没改的。
#
# 聚合：队列深度、积压时长、outbox 积压这几个 gauge 每个副本上报的都是同一个全局值，用 max，
#       不要 sum。选择器用 job（ServiceMonitor 打的 target label；compose 里是 msvcservice-api /
#       msvcservice-worker）。
# 范围：每条 expr 都带 {job=~"msvcservice-.*"}。集群的 Prometheus 抓所有服务，没有这个选择器，
#       导入的规则会对别的服务（乃至 up == 0 对整个集群）报警。job 是 Service 名（<release>-api /
#       <release>-worker），release 名就是服务名；tools/new-service.sh 改名时一并替换。
groups:
  - name: msvcservice-http
    rules:
      - alert: HighHttpErrorRate
        expr: |
          sum by (job) (rate(http_server_request_duration_seconds_count{job=~"msvcservice-.*", http_response_status_code=~"5.."}[5m]))
            /
          sum by (job) (rate(http_server_request_duration_seconds_count{job=~"msvcservice-.*"}[5m])) > 0.05
        for: 5m
        labels: { service: msvcservice, alertgroup: http, severity: critical }
        annotations:
          summary: "{{ $labels.job }}: 5xx 占比超过 5%"
          description: |
            过去 5 分钟有 5% 以上的请求以 5xx 结束。
            查日志：{app="msvcservice"} |= "http request" | json | status >= 500
            按错误码看：sum by (error_code) (rate(msvc_http_problems_total{http_response_status_code=~"5.."}[5m]))
            常见成因：下游不可用（UPSTREAM_SERVICE_UNAVAILABLE，看熔断器面板）、数据库或 Redis 不可达
            （看 DependencyUnavailable 与 msvc_health_check_up）、新版本 panic（recoverer 记成 500，日志里有栈）。

      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_server_request_duration_seconds_bucket{job=~"msvcservice-.*"}[5m]))) > 0.5
        for: 10m
        labels: { service: msvcservice, alertgroup: http, severity: warning }
        annotations:
          summary: "{{ $labels.job }}: p95 延迟超过 500ms"
          description: |
            先分清是慢 SQL 还是池排队：慢 SQL 看日志 {app="msvcservice"} |= "slow query"，
            排队看 rate(pgxpool_empty_acquire_total[5m])。再看下游：按路由的 p95 与熔断器面板。

      - alert: UpstreamUnavailable
        expr: sum by (job, http_route) (rate(msvc_http_problems_total{job=~"msvcservice-.*", error_code="UPSTREAM_SERVICE_UNAVAILABLE"}[5m])) > 0.1
        for: 5m
        labels: { service: msvcservice, alertgroup: http, severity: warning }
        annotations:
          summary: "{{ $labels.job }} {{ $labels.http_route }}: 下游持续不可用"
          description: |
            下游调用持续失败或熔断器打开，客户端收到 502。
            看熔断：increase(msvc_resilience_breaker_state_changes_total{to="open"}[15m])
            查日志：{app="msvcservice"} |= "circuit breaker" or |= "request failed"
            常见成因：下游发布中、下游超时阈值低于它的真实延迟、base_url 配错（那是 NOT_CONFIGURED，另一种码）。

      - alert: OutboxBacklogGrowing
        expr: max by (job) (msvc_messaging_outbox_pending{job=~"msvcservice-.*"}) > 100
        for: 10m
        labels: { service: msvcservice, alertgroup: messaging, severity: warning }
        annotations:
          summary: "{{ $labels.job }}: outbox 积压超过 100 条"
          description: |
            查库：SELECT status, count(*), min(occurred_at) FROM outbox_messages GROUP BY 1;
            查日志：{app="msvcservice"} |= "outbox"
            常见成因：RabbitMQ 不可达（投递器自动重连，积压会自己消化）、所有 pod 都是 rabbitmq.enabled=false。

      - alert: OutboxOldestPendingAge
        expr: max by (job) (msvc_messaging_outbox_oldest_pending_age_seconds{job=~"msvcservice-.*"}) > 300
        for: 5m
        labels: { service: msvcservice, alertgroup: messaging, severity: critical }
        annotations:
          summary: "{{ $labels.job }}: 最老的待投递事件已等待 {{ $value | humanizeDuration }}"
          description: |
            事件晚到超过 5 分钟：投递器没在跑或 broker 不可达。深度看 OutboxBacklogGrowing，这条看的是"晚了多久"。
            FAILED 行（max_attempts 用尽）不在这条里：修好原因后 UPDATE outbox_messages SET status='PENDING', attempts=0 WHERE status='FAILED' 回放。

      - alert: MessagesDeadLetteredExhausted
        expr: increase(msvc_messaging_dead_lettered_total{job=~"msvcservice-.*", reason="exhausted"}[15m]) > 0
        labels: { service: msvcservice, alertgroup: messaging, severity: critical }
        annotations:
          summary: "{{ $labels.queue }}: 消息走完重试梯队仍失败，进了 DLQ"
          description: |
            重试梯队（30s、2m、10m）全部失败说明依赖持续不可用，不是抖动。reason=non_retryable 是
            handler 用 messaging.NonRetryable 主动放弃的消息，属于日常噪声，刻意不在这条里。
            查日志：{app="msvcservice"} |= "dead-lettered"
            回放：修好原因后 tools/dlq-replay.sh <queue>（重置重试计数）。

  - name: msvcservice-tasks
    rules:
      - alert: TaskQueueBacklogGrowing
        expr: max by (queue) (msvc_tasks_queue_depth{job=~"msvcservice-.*"}) > 100
        for: 10m
        labels: { service: msvcservice, alertgroup: tasks, severity: warning }
        annotations:
          summary: "{{ $labels.queue }}: 可领取的任务超过 100 个"
          description: |
            查库：SELECT queue_name, count(*), min(deliver_on) FROM task_queues WHERE popped = false AND deliver_on <= now() GROUP BY 1;
            常见成因：没有 pod 在跑这个队列（TASKS__MAX_WORKERS=0 配到了所有 pod）、worker 数跟不上产量。

      - alert: TaskOldestPendingAge
        expr: max by (queue) (msvc_tasks_oldest_pending_age_seconds{job=~"msvcservice-.*"}) > 600
        for: 5m
        labels: { service: msvcservice, alertgroup: tasks, severity: warning }
        annotations:
          summary: "{{ $labels.queue }}: 最老的到期任务已等待 {{ $value | humanizeDuration }}"
          description: |
            任务晚了 10 分钟以上。深度不大但时长在涨，通常是 handler 一直失败在退避里（看 TasksFailing、
            日志 |= "task failed"），或 worker 反复在停机/崩溃时丢下任务被 fixer 回收（increase(msvc_tasks_reclaimed_total[15m])）。

      - alert: TasksExhausted
        expr: increase(msvc_tasks_dead_total{job=~"msvcservice-.*", reason="exhausted"}[15m]) > 0
        labels: { service: msvcservice, alertgroup: tasks, severity: warning }
        annotations:
          summary: "{{ $labels.queue }}: 任务用尽 attempts 预算后被放弃"
          description: |
            reason=discarded 是 handler 主动放弃，不在这条里。查日志：{app="msvcservice"} |= "task dead"。
            放弃的任务已从 task_queues 删除，需要重放时从业务表的状态重新入队。

      - alert: TasksFailing
        expr: sum by (queue) (increase(msvc_tasks_failed_total{job=~"msvcservice-.*"}[30m])) > 3
        labels: { service: msvcservice, alertgroup: tasks, severity: warning }
        annotations:
          summary: "{{ $labels.queue }}: 任务 handler 30 分钟内失败超过 3 次"
          description: |
            handler 返回 error 或 panic 都计在这里，任务按退避（tasks.retry_base_delay → retry_max_delay）重排。
            一次性任务失败满 max_attempts 后进 TasksExhausted；周期任务不受预算限制，只会在这里持续出现。
            查日志：{app="msvcservice"} |= "task failed" or |= "task handler panicked"（panic 带栈）。

  - name: msvcservice-database
    rules:
      - alert: DbPoolSaturated
        expr: sum by (job) (rate(pgxpool_empty_acquire_total{job=~"msvcservice-.*"}[5m])) > 1
        for: 5m
        labels: { service: msvcservice, alertgroup: database, severity: warning }
        annotations:
          summary: "{{ $labels.job }}: 每秒超过 1 次获取连接要排队，连接池满了"
          description: |
            看 pgxpool_acquired_connections 是否贴着 pgxpool_max_connections，等待时间看
            pgxpool_empty_acquire_wait_time_nanoseconds_total。
            常见成因：池太小（POSTGRES__MAX_CONNS）、慢查询占着连接（看 DbSlowQueries）、statement_timeout 过长。
            注意：慢 SQL 日志里的 elapsed 不含排队时间，排队只在这条指标上可见。

      - alert: DbSlowQueries
        expr: sum by (job) (rate(msvc_db_slow_queries_total{job=~"msvcservice-.*"}[5m])) > 0.5
        for: 10m
        labels: { service: msvcservice, alertgroup: database, severity: warning }
        annotations:
          summary: "{{ $labels.job }}: 慢 SQL 持续出现（> {{ $value | printf \"%.1f\" }} 条/秒）"
          description: |
            查日志：{app="msvcservice"} |= "slow query"（带语句文本，不带实参）。
            logged="false" 的部分被限速吞掉了行，总量是两个取值相加；阈值 POSTGRES__SLOW_QUERY_THRESHOLD。

  - name: msvcservice-infra
    rules:
      - alert: DependencyUnavailable
        expr: min by (job, check) (msvc_health_check_up{job=~"msvcservice-.*"}) == 0
        for: 2m
        labels: { service: msvcservice, alertgroup: infra, severity: critical }
        annotations:
          summary: "{{ $labels.job }}: 依赖 {{ $labels.check }} 不可达"
          description: |
            gating="true"（postgres）时 pod 已经 NotReady、被摘出 Service；gating="false"（redis、rabbitmq）时
            pod 仍然就绪、服务降级运行：缓存回源数据库，事件积压在 outbox。
            这条就是共享依赖故障的主信号，readiness 刻意不为它们摘流量（docs/architecture.md 失败语义）。
            详情：admin 端口的 /health/ready 报告里每项的 description。

      - alert: ScrapeTargetDown
        expr: up{job=~"msvcservice-.*"} == 0
        for: 2m
        labels: { service: msvcservice, alertgroup: infra, severity: critical }
        annotations:
          summary: "{{ $labels.job }} 没有暴露 /metrics"
          description: "pod 没起来，或 ServiceMonitor 的 selector / port（admin）没选中 Service。"
