openapi: 3.1.0
info:
  title: MsvcService API
  version: "1.0"
  description: |
    Reference service built from the Go microservice template. Success responses are the DTO
    itself (lists use the paging envelope); every failure is an RFC 9457 problem details body
    with `errorCode` and `traceId`. Tokens are the platform's user-service HS256 access tokens;
    every route names the identity plane (`realm`) it serves.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Orders
  - name: Back office
  - name: Operational
paths:
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create an order (consumer plane)
      description: |
        Prices every line with the inventory service (which also says whether it can be sold; the
        client never states a price), then commits the order and its `orders.order-created.v1`
        event in one transaction. Send `Idempotency-Key` to make a retried POST safe: the customer
        gets one order per key, however often the request is repeated or retried concurrently. The
        first request answers 201; a repeat with the same items answers 200 with that order as it
        stands now (nothing is priced, created or published again); the key reused for different
        items is a 422 `ORDER_REQUEST_ID_REUSED`. The key is kept with the order, so it does not
        expire.

        400 is the request's shape: `VALIDATION_FAILED` lists the fields in `errors` (an
        `Idempotency-Key` over 128 characters included), `BAD_REQUEST` is malformed JSON. 422 is a
        rule of the order: `ORDER_ITEMS_REQUIRED` (no items), `ORDER_ITEM_INVALID` (more than 100
        items), `ORDER_ITEM_UNAVAILABLE`, `ORDER_TOTAL_TOO_LARGE`, `ORDER_REQUEST_ID_REUSED`. 502 `UPSTREAM_SERVICE_UNAVAILABLE` is the
        inventory service failing or its breaker open; 504 `REQUEST_TIMEOUT` is the server's own
        request deadline.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
            X-Trace-ID: { $ref: '#/components/headers/TraceID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "200":
          description: A repeat of an earlier request with the same `Idempotency-Key` and items; the order it created
          headers:
            Location: { schema: { type: string } }
            X-Trace-ID: { $ref: '#/components/headers/TraceID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "415": { $ref: '#/components/responses/Problem' }
        "422": { $ref: '#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/Problem' }
        "502": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
        "504": { $ref: '#/components/responses/Problem' }
    get:
      tags: [Orders]
      summary: List my orders (consumer plane)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: A page of orders
          headers:
            X-Trace-ID: { $ref: '#/components/headers/TraceID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/Problem' }
        "504": { $ref: '#/components/responses/Problem' }
  /api/v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Anything but a positive integer is a 400 `BAD_REQUEST`.
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Orders]
      summary: Get one of my orders (consumer plane)
      description: Another customer's order looks exactly like a missing one (404).
      responses:
        "200":
          description: The order
          headers:
            X-Trace-ID: { $ref: '#/components/headers/TraceID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/Problem' }
        "504": { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Orders]
      summary: Cancel a PENDING order (consumer plane)
      responses:
        "204":
          description: Cancelled
          headers:
            X-Trace-ID: { $ref: '#/components/headers/TraceID' }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
        "409":
          description: Not PENDING (`ORDER_NOT_CANCELLABLE`) or modified concurrently (`CONCURRENCY_CONFLICT`)
          headers:
            X-Trace-ID: { $ref: '#/components/headers/TraceID' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "429": { $ref: '#/components/responses/Problem' }
        "504": { $ref: '#/components/responses/Problem' }
  /api/v1/backoffice/orders:
    get:
      tags: [Back office]
      summary: List every customer's orders (back-office plane, scope `orders.read`)
      description: |
        Keyset paging, newest first: this list grows without bound, so it is never counted and
        never OFFSET. Pass the previous page's `nextCursor` as `cursor` until `hasMore` is false.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: A page of orders
          headers:
            X-Trace-ID: { $ref: '#/components/headers/TraceID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderCursorPage' }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/Problem' }
        "504": { $ref: '#/components/responses/Problem' }
  # The operational endpoints are served by the admin listener (server.admin_addr), never by the
  # API listener and never behind the ingress.
  /health/startup:
    servers: [{ url: http://localhost:8081 }]
    get:
      tags: [Operational]
      security: []
      summary: Startup probe
      responses:
        "200": { description: Started }
        "503": { description: Still starting }
  /health/live:
    servers: [{ url: http://localhost:8081 }]
    get:
      tags: [Operational]
      security: []
      summary: Liveness probe (process only)
      responses:
        "200": { description: Alive }
  /health/ready:
    servers: [{ url: http://localhost:8081 }]
    get:
      tags: [Operational]
      security: []
      summary: Readiness probe
      description: |
        Gates on PostgreSQL only. Redis and RabbitMQ are reported (`"gating": false`; the overall
        status becomes `Degraded`, still 200): every replica shares them and degrades around them.
      responses:
        "200": { description: Ready (Healthy or Degraded) }
        "503": { description: PostgreSQL is unreachable or the host is draining }
  /metrics:
    servers: [{ url: http://localhost:8081 }]
    get:
      tags: [Operational]
      security: []
      summary: Prometheus exposition
      responses:
        "200": { description: Metrics }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token issued by user-svc; `realm` is CONSUMER or BACKOFFICE.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: The client's id for this request (a UUID, say); one order per customer and key.
      schema: { type: string, maxLength: 128 }
    Page:
      name: page
      in: query
      description: |
        Below 1 reads as 1. Not an integer, or past 10000, is a 400 `VALIDATION_FAILED` naming the
        parameter: a list that deep belongs on keyset paging.
      schema: { type: integer, maximum: 10000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: |
        A number below 1 is the default (20) and one above 200 is 200 (clamped, not refused); a value that is not an integer is a 400 VALIDATION_FAILED naming the parameter.
        The page envelope reports the size actually used.
      schema: { type: integer, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque; the `nextCursor` of the previous page. Omit for the first page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: "A number below 1 is the default (20) and one above 200 is 200 (clamped, not refused); a value that is not an integer is a 400 VALIDATION_FAILED naming the parameter."
      schema: { type: integer, default: 20 }
  headers:
    TraceID:
      description: Bare 32-hex trace id of the request, the same value as `traceId` in a problem and `trace_id` in the logs.
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      headers:
        X-Trace-ID: { $ref: '#/components/headers/TraceID' }
        Retry-After:
          description: Seconds to wait before retrying; on 429 and 503 only.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, examples: ["urn:msvc:error:not-found"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errorCode: { type: string, description: UPPER_SNAKE_CASE, stable client contract }
        traceId: { type: string, description: Bare 32-hex trace id; also in the X-Trace-ID header }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: Field errors for VALIDATION_FAILED
    CreateOrderRequest:
      type: object
      description: |
        The shape (this schema) is checked by the API and answers 400 `VALIDATION_FAILED`. How many
        items an order may carry, 1 to 100, is a rule of the order and answers 422
        (`ORDER_ITEMS_REQUIRED`, `ORDER_ITEM_INVALID`), so it is deliberately not a schema constraint.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CreateOrderItem' }
    CreateOrderItem:
      type: object
      description: What and how many. There is no price; the inventory service prices each line.
      required: [sku, quantity]
      properties:
        sku: { type: string, maxLength: 64 }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    Order:
      type: object
      properties:
        id: { type: integer }
        customerId: { type: string }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED] }
        totalAmount: { type: number, description: A JSON number with the exact decimal digits (39.98) }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderItem:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
    OrderPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
    OrderCursorPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        nextCursor: { type: string, description: Present only when hasMore }
        hasMore: { type: boolean }
